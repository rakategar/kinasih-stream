<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinasih Stream — Admin Panel</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d0d0d; color: #e0e0e0; min-height: 100vh; }

  /* ── Login ── */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 2.5rem 2rem; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .login-logo { width: 52px; height: 52px; object-fit: contain; }
  .login-title { font-size: 1.3rem; font-weight: 700; color: #fff; }
  .login-subtitle { font-size: 0.8rem; color: #666; }
  .login-box input { width: 100%; padding: 0.75rem 1rem; background: #111; border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 0.95rem; outline: none; }
  .login-box input:focus { border-color: #7b5ea7; }
  .login-box button { width: 100%; padding: 0.8rem; background: #7b5ea7; border: none; border-radius: 8px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .login-box button:hover { background: #9370c8; }

  /* ── Dashboard ── */
  #dashboard { display: none; }
  .topbar { background: #161616; border-bottom: 1px solid #2a2a2a; padding: 0 1.5rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .topbar-left { display: flex; align-items: center; gap: 0.75rem; }
  .topbar-logo { width: 28px; height: 28px; object-fit: contain; }
  .topbar-title { font-size: 1rem; font-weight: 700; color: #fff; }
  .topbar-badge { font-size: 0.7rem; background: #7b5ea7; color: #fff; padding: 2px 8px; border-radius: 999px; }
  .btn-logout { background: transparent; border: 1px solid #3a3a3a; border-radius: 6px; color: #888; font-size: 0.8rem; padding: 0.35rem 0.75rem; cursor: pointer; }
  .btn-logout:hover { border-color: #555; color: #ccc; }

  .main { padding: 1.5rem; max-width: 900px; margin: 0 auto; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .section-title { font-size: 1rem; font-weight: 600; color: #ccc; }
  .btn-add { background: #7b5ea7; border: none; border-radius: 8px; color: #fff; font-size: 0.85rem; font-weight: 600; padding: 0.5rem 1.1rem; cursor: pointer; }
  .btn-add:hover { background: #9370c8; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
  .stat-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 1rem 1.2rem; }
  .stat-label { font-size: 0.75rem; color: #666; margin-bottom: 0.3rem; }
  .stat-value { font-size: 1.6rem; font-weight: 700; color: #fff; }
  .stat-card.active .stat-value { color: #4caf50; }
  .stat-card.expired .stat-value { color: #f44336; }

  .table-wrap { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #111; }
  th { padding: 0.75rem 1rem; text-align: left; font-size: 0.75rem; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #2a2a2a; }
  td { padding: 0.85rem 1rem; font-size: 0.88rem; border-bottom: 1px solid #1f1f1f; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .badge.active { background: rgba(76, 175, 80, 0.15); color: #66bb6a; }
  .badge.expired { background: rgba(244, 67, 54, 0.15); color: #ef5350; }
  .btn-del { background: transparent; border: 1px solid #3a2a2a; border-radius: 6px; color: #888; font-size: 0.78rem; padding: 0.3rem 0.7rem; cursor: pointer; }
  .btn-del:hover { background: rgba(244,67,54,0.12); border-color: #f44336; color: #ef5350; }
  .empty-row td { text-align: center; padding: 2rem; color: #555; font-size: 0.9rem; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 1.75rem; width: 100%; max-width: 400px; }
  .modal h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 1.25rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem; }
  .form-group label { font-size: 0.78rem; color: #888; }
  .form-group input, .form-group select { padding: 0.7rem 0.9rem; background: #111; border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 0.9rem; outline: none; }
  .form-group input:focus, .form-group select:focus { border-color: #7b5ea7; }
  .form-group select option { background: #1a1a1a; }
  .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; }
  .btn-cancel { background: transparent; border: 1px solid #333; border-radius: 7px; color: #888; padding: 0.6rem 1.1rem; cursor: pointer; font-size: 0.9rem; }
  .btn-save { background: #7b5ea7; border: none; border-radius: 7px; color: #fff; padding: 0.6rem 1.3rem; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
  .btn-save:hover { background: #9370c8; }
  .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

  #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 0.8rem 1.2rem; border-radius: 8px; font-size: 0.88rem; font-weight: 500; opacity: 0; transform: translateY(8px); transition: opacity 0.25s, transform 0.25s; pointer-events: none; z-index: 200; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.success { background: #1e3a1e; border: 1px solid #4caf50; color: #66bb6a; }
  #toast.error { background: #3a1e1e; border: 1px solid #f44336; color: #ef5350; }

  .error-msg { padding: 0.6rem 0.8rem; background: rgba(244,67,54,0.12); border: 1px solid rgba(244,67,54,0.3); border-radius: 6px; color: #ef5350; font-size: 0.82rem; }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr 1fr; } th.hide-sm, td.hide-sm { display: none; } }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <img class="login-logo" src="../images/logo.png" alt="Logo" onerror="this.style.display='none'" />
    <div class="login-title">Kinasih Stream</div>
    <div class="login-subtitle">Admin Panel</div>
    <input id="admin-pass" type="password" placeholder="Password Admin" autocomplete="current-password" />
    <div id="login-error" class="error-msg" style="display:none"></div>
    <button onclick="doAdminLogin()">Masuk sebagai Admin</button>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <div class="topbar-left">
      <img class="topbar-logo" src="../images/logo.png" alt="" onerror="this.style.display='none'" />
      <span class="topbar-title">Kinasih Stream</span>
      <span class="topbar-badge">Admin</span>
    </div>
    <button class="btn-logout" onclick="logout()">Keluar</button>
  </div>

  <div class="main">
    <div class="stats">
      <div class="stat-card"><div class="stat-label">Total User</div><div class="stat-value" id="stat-total">—</div></div>
      <div class="stat-card active"><div class="stat-label">Aktif</div><div class="stat-value" id="stat-active">—</div></div>
      <div class="stat-card expired"><div class="stat-label">Expired</div><div class="stat-value" id="stat-expired">—</div></div>
    </div>
    <div class="section-header">
      <div class="section-title">Daftar User</div>
      <button class="btn-add" onclick="openAddModal()">+ Tambah User</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Username</th><th>Status</th><th>Expired</th><th class="hide-sm">Dibuat</th><th></th></tr></thead>
        <tbody id="user-tbody"><tr class="empty-row"><td colspan="5">Memuat...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div id="add-modal" class="modal-bg" style="display:none">
  <div class="modal">
    <h2>Tambah User Baru</h2>
    <div class="form-group">
      <label>Username</label>
      <input id="new-username" type="text" placeholder="cth: budi123" autocomplete="off" />
      <label>Password</label>
      <input id="new-password" type="text" placeholder="Buat password untuk user ini" autocomplete="off" />
      <label>Durasi Akses</label>
      <select id="new-duration">
        <option value="7d">7 Hari</option>
        <option value="1m" selected>1 Bulan (30 hari)</option>
      </select>
    </div>
    <div id="add-error" class="error-msg" style="display:none"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">Batal</button>
      <button class="btn-save" id="btn-save" onclick="saveUser()">Simpan</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const TOKEN_KEY = 'kinasih_admin_token';
let adminToken = localStorage.getItem(TOKEN_KEY);

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  setTimeout(() => { t.className = ''; }, 3000);
}

async function doAdminLogin() {
  const pass = document.getElementById('admin-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!pass) { errEl.textContent = 'Password diperlukan'; errEl.style.display = 'block'; return; }
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Login gagal'; errEl.style.display = 'block'; return; }
    adminToken = data.token;
    localStorage.setItem(TOKEN_KEY, adminToken);
    showDashboard();
  } catch (e) {
    errEl.textContent = 'Tidak dapat terhubung ke server';
    errEl.style.display = 'block';
  }
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  adminToken = null;
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadUsers();
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
}

function isExpired(expiresAt) {
  return new Date(expiresAt).getTime() < Date.now();
}

async function loadUsers() {
  try {
    const res = await fetch('/api/admin/users', { headers: { 'Authorization': 'Bearer ' + adminToken } });
    if (res.status === 401) { logout(); return; }
    const users = await res.json();
    const active = users.filter(u => u.is_active && !isExpired(u.expires_at)).length;
    const expired = users.filter(u => !u.is_active || isExpired(u.expires_at)).length;
    document.getElementById('stat-total').textContent = users.length;
    document.getElementById('stat-active').textContent = active;
    document.getElementById('stat-expired').textContent = expired;
    const tbody = document.getElementById('user-tbody');
    if (!users.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Belum ada user. Klik "+Tambah User" untuk mulai.</td></tr>';
      return;
    }
    tbody.innerHTML = users.map(u => {
      const exp = isExpired(u.expires_at) || !u.is_active;
      return `<tr><td><strong>${escHtml(u.username)}</strong></td><td><span class="badge ${exp ? 'expired' : 'active'}">${exp ? 'Expired' : 'Aktif'}</span></td><td>${fmtDate(u.expires_at)}</td><td class="hide-sm" style="color:#666">${fmtDate(u.created_at)}</td><td><button class="btn-del" onclick="deleteUser('${u.id}','${escHtml(u.username)}')">Hapus</button></td></tr>`;
    }).join('');
  } catch (e) {
    document.getElementById('user-tbody').innerHTML = '<tr class="empty-row"><td colspan="5">Gagal memuat data</td></tr>';
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function deleteUser(id, name) {
  if (!confirm(`Hapus user "${name}"?`)) return;
  try {
    const res = await fetch('/api/admin/users?id=' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + adminToken } });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) { showToast('Gagal menghapus user', 'error'); return; }
    showToast(`User "${name}" dihapus`);
    loadUsers();
  } catch { showToast('Gagal menghapus user', 'error'); }
}

function openAddModal() {
  document.getElementById('new-username').value = '';
  document.getElementById('new-password').value = '';
  document.getElementById('new-duration').value = '1m';
  document.getElementById('add-error').style.display = 'none';
  document.getElementById('add-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('new-username').focus(), 50);
}

function closeAddModal() { document.getElementById('add-modal').style.display = 'none'; }

async function saveUser() {
  const username = document.getElementById('new-username').value.trim();
  const password = document.getElementById('new-password').value;
  const duration = document.getElementById('new-duration').value;
  const errEl = document.getElementById('add-error');
  const btn = document.getElementById('btn-save');
  errEl.style.display = 'none';
  if (!username || !password) { errEl.textContent = 'Username dan password harus diisi'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    const res = await fetch('/api/admin/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminToken },
      body: JSON.stringify({ username, password, duration })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Gagal menyimpan'; errEl.style.display = 'block'; return; }
    closeAddModal();
    showToast(`User "${username}" berhasil ditambahkan`);
    loadUsers();
  } catch { errEl.textContent = 'Tidak dapat terhubung ke server'; errEl.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = 'Simpan'; }
}

document.getElementById('admin-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doAdminLogin(); });
if (adminToken) showDashboard();
</script>
</body>
</html>
